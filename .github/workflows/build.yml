name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q kada-billing-source.zip -d app
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build APK
        working-directory: app/kada-billing
        run: |
          npm ci
          npm run build
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/kada-billing.apk"
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete test-build -y --cleanup-tag || true
          gh release create test-build kada-billing.apk --target "$GITHUB_SHA" --title "Kada Billing test build" --notes "Install kada-billing.apk on your Android phone."
